<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campanha Gratidão</title>
  <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/layout.css">
     <link rel="stylesheet" href="/css/containers.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/produtos.css">
    <link rel="stylesheet" href="/css/descricao.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/temas-campanhas.css">
    <link rel="stylesheet" href="/css/gratidao.css">
</head>
<body class="gratidao">
  <header>
    <h1>🌟 Campanha Gratidão</h1>
    <p>Reconheça quem faz a diferença. Cada gesto de carinho conta.</p>
  </header>

  <main>
    <div id="produtos-container" class="grid-campanha"></div>

    <!-- Botões de ação -->
    <div class="container-botao">
      <button id="botao-compartilhar" class="botao-compartilhar">
        <span>🔗</span> Compartilhar
      </button>
    </div>

    <div style="text-align: center; margin-top: 2em; margin-bottom: 2em;">
      <a href="../index.html" id="btn-voltar" class="botao-voltar">⬅ Voltar para o início</a>
    </div>
  </main>

  <!-- Modal de Compartilhamento -->
  <div id="modal-compartilhar" style="display: none;">
    <div class="conteudo-modal">
      <h3>Compartilhar esta campanha</h3>
      <button id="compartilhar-whatsapp">WhatsApp</button>
      <button id="copiar-mensagem">Copiar Link</button>
      <button id="compartilhar-nativo">Compartilhar Nativo</button>
      <button id="fechar-modal">Fechar</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Lima Calixto | Campanha Gratidão</p>
  </footer>

  <script src="/js/leitor-campanhas.js" defer></script>
</body>
</html>
