<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Campanha Dia do Cliente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/layout.css">
     <link rel="stylesheet" href="/css/containers.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/produtos.css">
    <link rel="stylesheet" href="/css/descricao.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/temas-campanhas.css">
</head>
<body class="dia-do-cliente">
  <main>
    <header>
      <h1 class="titulo">🎉 Campanha Dia do Cliente</h1>
      <p class="descricao">
        Hoje celebramos quem faz tudo acontecer: você, nosso cliente! Aproveite ofertas exclusivas e condições especiais como forma de agradecimento pela sua confiança.
      </p>
    </header>

    <section>
      <h2 class="titulo-secundario">Produtos em destaque</h2>
      <div class="grid-produtos" id="produtos-container">
        <!-- Os cards de produtos serão inseridos aqui via JS -->
      </div>
    </section>

    <div class="container-botao">
      <button id="botao-compartilhar" class="botao-compartilhar">
        <span>🔗</span> Compartilhar
      </button>
    </div>

    <div style="text-align: center; margin-top: 2em; margin-bottom: 2em;">
        <a href="../index.html" id="btn-voltar" class="botao-voltar">⬅ Voltar para o início</a>
      </div>
    </div>
  </main>

  <div id="modal-compartilhar" class="modal-compartilhar">
    <div class="modal-conteudo">
      <h2>Compartilhar Catálogo</h2>
      <button id="compartilhar-whatsapp">📱 WhatsApp</button>
      <button id="copiar-mensagem">📋 Copiar Mensagem</button>
      <button id="compartilhar-nativo">📤 Compartilhar Nativo</button>
      <button id="fechar-modal">❌ Fechar</button>
    </div>
  </div>

  <script src="/js/leitor-campanhas.js" defer></script>
  <script src="/js/footer.js" defer></script>
</body>
</html>
